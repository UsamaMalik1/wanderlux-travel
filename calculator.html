<section class="calculator">

<h2>Trip Cost Calculator</h2>

<p>
Use our calculator to estimate your holiday expenses based on destination, number of travellers, travel duration, and package style.
</p>

<label>Destination</label>

<select id="destination">
<option value="150">Bali</option>
<option value="250">Paris</option>
<option value="200">Dubai</option>
</select>

<label>Number of Travellers</label>

<input type="number" id="travellers" placeholder="Enter number of travellers">

<label>Number of Days</label>

<input type="number" id="days" placeholder="Enter number of days">

<label>Travel Style</label>

<select id="style">
<option value="1">Budget</option>
<option value="1.5">Standard</option>
<option value="2">Luxury</option>
</select>

<button onclick="calculateTrip()">
Calculate Trip Cost
</button>

<h3 id="result"></h3>

</section>
